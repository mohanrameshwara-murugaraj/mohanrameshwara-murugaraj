<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64" role="img" aria-label="What I'm coding"><title>What I'm coding</title><style>@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes show{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleY(0)}to{transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}@keyframes nudgeup{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}90%{transform:translateY(-1px) scale(1.01) rotate(.2deg)}100%{opacity:1;transform:none}}@keyframes slidein{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}@keyframes arrowin{0%{opacity:0;transform:translateX(-30px)}60%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:none}}@keyframes roll{from{transform:translateY(60px)}to{transform:none}}@keyframes sheen{0%{transform:translateX(-260px) skewX(-20deg)}22%,100%{transform:translateX(420px) skewX(-20deg)}}@keyframes ring{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}.b{transform-box:fill-box}.c{transform-box:fill-box;transform-origin:center}.bot{transform-box:fill-box;transform-origin:50% 100%}.tile{transform-box:fill-box;transform-origin:50% 60%}.rg,.sh{opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil,.sh,.rg{display:none}}</style><text x="2.0" y="46.0" font-family="'Instrument Serif', Georgia, serif" font-size="34" fill="#e6edf3" class="b" style="animation:rise 0.8s cubic-bezier(.2,.7,.2,1) 4.400s both">What I'm <tspan font-style="italic">coding</tspan></text></svg>