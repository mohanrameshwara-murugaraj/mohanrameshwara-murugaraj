name: README cards

on:
  schedule:
    - cron: "17 4 * * *"   # every morning, 05:17 Berlin (winter time)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - fonts/**
      - assets/**
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools and Pillow
        run: pip install fonttools Pillow

      - name: Refresh contribution and repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repos, graph)
        run: python scripts/render_readme_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh README cards ($(date -u +%Y-%m-%d))"
            git push
          fi
